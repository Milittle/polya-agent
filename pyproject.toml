[project]
name = "polya"
version = "0.1.0"
description = "一个最小可运行的 LLM 工具调用 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
]

[project.scripts]
polya = "polya.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polya"]
